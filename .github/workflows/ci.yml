name: CI Pipeline

# main 브랜치 push 또는 PR
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# OIDC 토큰 요청 권한
permissions:
  id-token: write   # OIDC 토큰 요청용
  contents: read    # 코드 체크아웃용

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Step 1: 코드 가져오기
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Debug OIDC claims
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('sts.amazonaws.com');
            const p = JSON.parse(Buffer.from(token.split('.')[1], 'base64url').toString());
            core.info(`sub: ${p.sub}`);
            core.info(`aud: ${p.aud}`);  

      # Step 2: 스프링 빌드를 위한 Java 17 설치
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'corretto'

      # Step 3: Gradle 빌드 최적화 및 캐시 (429 에러 방지 포함)
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      # Step 4: 테스트 실행
      - name: Run tests
        run: ./gradlew test

      # Step 5: JAR 빌드
      - name: Build JAR
        run: ./gradlew bootJar

      # Step 6: AWS 자격증명 - OIDC
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ap-northeast-2



        

      # Step 7: ECR 로그인
      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v1

      # Step 8: Docker 빌드 및 push
      - name: Build and push Docker image
        run: |
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
          IMAGE_URI=${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.ap-northeast-2.amazonaws.com/${{ vars.ECR_REPOSITORY }}

          # Docker 빌드
          docker build --platform linux/arm64 -t $IMAGE_URI:$SHORT_SHA .
          
          # ECR push
          docker push $IMAGE_URI:$SHORT_SHA
          
          # 결과 출력
          echo "✅ Pushed: $IMAGE_URI:$SHORT_SHA"
          
